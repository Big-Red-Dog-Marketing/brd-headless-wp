name: Release

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Lint PHP
        run: find plugin theme -name '*.php' -not -path '*/vendor/*' -print0 | xargs -0 -n1 php -l

      - name: Check versions
        run: |
          plugin=$(sed -n 's/^ \* Version: //p' plugin/brd-headless/brd-headless.php)
          constant=$(sed -n "s/^const BRD_HEADLESS_VERSION = '\(.*\)';/\1/p" plugin/brd-headless/brd-headless.php)
          theme=$(sed -n 's/^Version: //p' theme/brd-headless-theme/style.css)
          echo "plugin=$plugin constant=$constant theme=$theme"
          test "$plugin" = "$constant" && test "$plugin" = "$theme"
          grep -q "^## $plugin " CHANGELOG.md || { echo "No CHANGELOG entry for $plugin"; exit 1; }
          echo "VERSION=$plugin" >> "$GITHUB_ENV"

      - name: Build zips
        run: |
          (cd plugin && zip -qr ../brd-headless.zip brd-headless)
          (cd theme && zip -qr ../brd-headless-theme.zip brd-headless-theme)

      # A push to main whose version has no release yet publishes one, tagged vX.Y.Z.
      - name: Publish release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "v$VERSION is already released"
            exit 0
          fi
          notes=$(awk -v v="## $VERSION " 'index($0, v) == 1 {f=1; next} /^## /{f=0} f' CHANGELOG.md)
          gh release create "v$VERSION" brd-headless.zip brd-headless-theme.zip --target "$GITHUB_SHA" --title "v$VERSION" --notes "$notes"
